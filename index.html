let page='home',selected=null,username='Mia',currentTheme='blue';
function login(){let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;if(!u||!p){toast('请输入用户名和密码');return}username=u;document.getElementById('userName').textContent=u;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');go('home')}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('userMenu').classList.add('hidden')}
function toggleUser(){document.getElementById('userMenu').classList.toggle('hidden')}
function go(p){page=p;selected=null;document.querySelectorAll('.navitem').forEach(a=>a.classList.toggle('active',a.dataset.page===p));render()}
function hero(title,sub,icon='✉'){return `<section class="hero"><div><h1>${icon}　${title}</h1><p>${sub}</p></div><img class="mascot" src="${mascotSrc}" alt="Luxshare mascot"></section>`}
function render(){let m=document.getElementById('main');if(page==='home'){m.innerHTML=hero('欢迎使用邮件模板管理系统','快速查找 · 复用标准邮件模板 · 提升沟通效率')+`<section class="slogan"><div class="envelope">✉️</div><h2>标准化 · 高效率 · 易复用</h2><p>统一邮件模板　·　提升沟通效率　·　规范业务交流</p><img class="mascotlarge" src="${mascotSrc}" alt="Luxshare mascot"></section>`}
else if(page==='library')renderLibrary(m);else if(page==='favorites')renderFavorites(m);else if(page==='update')renderUpdate(m);else if(page==='requests')renderRequests(m);else if(page==='history')renderHistory(m);else if(page==='settings')renderSettings(m)}
function filterPanel(kind='library'){return `<section class="panel"><h2 class="paneltitle">⌕　${kind==='favorites'?'收藏搜索':'邮件搜索'}</h2><div class="filters"><div class="field keyword"><label>关键词搜索</label><input id="kw" placeholder="输入关键词（如：Shortage、ETA...）"></div><div class="field"><label>搜索项目</label><select id="cat"><option value="全部">全部</option><option>采购</option><option>LE3</option><option>LE4</option></select></div><div class="field"><label>邮件类型</label><select id="type"><option value="全部">全部</option><option>HL</option><option>FCST</option><option>ETD</option><option>ETA</option><option>对账</option></select></div><div class="field"><label>时间范围</label><input id="date" type="date"></div><div class="actions"><button class="btn primary" onclick="searchMails('${kind}')">⌕ 搜索</button><button class="btn" onclick="resetSearch()">↻ 重置</button></div></div></section>`}
function searchMails(kind){let kw=(document.getElementById('kw')?.value||'').toLowerCase(),cat=document.getElementById('cat')?.value||'全部',type=document.getElementById('type')?.value||'全部';let source=kind==='favorites'?mails.filter(x=>favorites.includes(x.id)):mails;let arr=source.filter(x=>(!kw||x.subject.toLowerCase().includes(kw)||x.body.toLowerCase().includes(kw))&&(cat==='全部'||x.category===cat)&&(type==='全部'||x.type===type));renderMailRows(arr,kind)}
function resetSearch(){['kw','date'].forEach(id=>{let e=document.getElementById(id);if(e)e.value=''});['cat','type'].forEach(id=>{let e=document.getElementById(id);if(e)e.value='全部'});document.getElementById('rows')?.replaceChildren();let msg=document.getElementById('resultCount');if(msg)msg.textContent='请设置搜索条件后，点击搜索';}
function renderLibrary(m){m.innerHTML=hero('邮件模板库','标准化邮件模板，快速查找与复用','✉')+filterPanel()+`<section class="panel"><div class="resulthead"><h2>✉　邮件列表 <span id="resultCount" class="muted small">请设置搜索条件后，点击搜索</span></h2></div><div class="tablewrap"><table><thead><tr><th>序号</th><th>邮件主题</th><th>邮件类型</th><th>项目/类别</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty"><div class="big">✉️⌕</div>请设置搜索条件后，查看邮件模板</div></section><div id="preview"></div>`}
function renderMailRows(arr,kind){let rows=document.getElementById('rows');if(!rows)return;document.getElementById('resultCount').textContent=`（${arr.length}）`;document.getElementById('empty').classList.toggle('hidden',arr.length>0);rows.innerHTML=arr.map((x,i)=>`<tr class="clickable ${selected===x.id?'selected':''}" onclick="selectMail(${x.id},'${kind}')"><td>${i+1}</td><td><b style="color:#0752bd">${x.subject}</b></td><td><span class="tag">${x.type}</span></td><td><span class="tag gold">${x.category}</span></td><td>${x.date}</td><td><button class="btn" onclick="event.stopPropagation();selectMail(${x.id},'${kind}')">查看</button></td></tr>`).join('')}
function selectMail(id,kind){selected=id;let x=mails.find(a=>a.id===id);if(!x)return;let preview=document.getElementById('preview');if(!preview){preview=document.createElement('div');preview.id='preview';document.getElementById('main').append(preview)}preview.innerHTML=`<section class="panel"><div class="resulthead"><h2>✉　邮件内容预览</h2><button class="btn" onclick="toggleFav(${id})">${favorites.includes(id)?'★ 已收藏':'☆ 收藏'}</button></div><p><b>邮件主题：</b>${x.subject}</p><p><b>邮件类型：</b><span class="tag">${x.type}</span>　<b>项目/类别：</b><span class="tag gold">${x.category}</span>　<b>更新时间：</b>${x.date}</p><div class="previewbody">${escapeHtml(x.body)}</div><h3>📎 附件（${x.files.length}）</h3>${x.files.map(f=>`<div class="fileitem">📗 ${f}<button class="btn" onclick="downloadSample('${f}')">下载</button></div>`).join('')||'<p class="muted small">无附件</p>'}<div class="btnrow" style="margin-top:13px"><button class="btn" onclick="copyMail(${id})">▣ 复制内容</button><button class="btn" onclick="downloadAll(${id})">⇩ 下载附件</button><button class="btn primary" onclick="useMail(${id})">➤ 直接使用</button></div></section>`;if(!history.some(h=>h.id===id))history.unshift({id,time:new Date().toLocaleString('sv-SE').slice(0,16),user:username});else if(id===1)history[0]={id,time:'2026-10-20 09:35',user:username};if(kind==='library')document.querySelectorAll('#rows tr').forEach(r=>r.classList.remove('selected'))}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderFavorites(m){m.innerHTML=hero('我的收藏','已收藏的常用邮件模板，便于快速查找与使用','☆')+filterPanel('favorites')+`<section class="panel"><h2 class="paneltitle">☆　收藏列表（${favorites.length}）</h2><div class="tablewrap"><table><thead><tr><th>序号</th><th>邮件主题</th><th>邮件类型</th><th>项目/类别</th><th>操作</th></tr></thead><tbody>${mails.filter(x=>favorites.includes(x.id)).map((x,i)=>`<tr><td>${i+1}</td><td>${x.subject}</td><td><span class="tag">${x.type}</span></td><td>${x.category}</td><td><button class="btn" onclick="favView(${x.id})">查看</button> <button class="btn danger" onclick="toggleFav(${x.id});go('favorites')">移除</button></td></tr>`).join('')}</tbody></table></div></section>`}
function favView(id){let x=mails.find(a=>a.id===id);toast('已打开：'+x.subject);selectMail(id,'favorites')}
function toggleFav(id){favorites.includes(id)?favorites=favorites.filter(x=>x!==id):favorites.push(id);toast(favorites.includes(id)?'已加入收藏':'已取消收藏');if(page==='favorites')render()}
function copyMail(id){let x=mails.find(a=>a.id===id);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(x.body).then(()=>toast('邮件内容已复制')).catch(()=>toast('请长按选择内容复制'));else toast('请长按选择内容复制')}
function downloadSample(name){let blob=new Blob(['Demo attachment for '+name+'\nThis is sample data only.'],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.replace(/\.xlsx$/i,'.txt');a.click();URL.revokeObjectURL(a.href);toast('已下载演示附件（TXT）')}
function downloadAll(id){let x=mails.find(a=>a.id===id);if(!x.files.length){toast('该邮件没有附件');return}x.files.forEach(f=>downloadSample(f))}
function useMail(id){copyMail(id);history.unshift({id,time:new Date().toLocaleString('sv-SE').slice(0,16),user:username});toast('已复制模板内容，可粘贴到邮件客户端')}
function renderUpdate(m){m.innerHTML=hero('更新申请','提交邮件模板的新增、修改或优化申请','✎')+`<section class="panel"><h2 class="paneltitle">✉　Update Mail 更新邮件模板</h2><form id="updateForm" onsubmit="submitRequest(event)"><div class="formgrid"><div class="field"><label>申请类型 *</label><select id="kind"><option>新增模板</option><option>修改模板</option><option>优化模板</option></select></div><div class="field"><label>项目/类别 *</label><select id="newcat"><option>采购</option><option>LE3</option><option>LE4</option></select></div><div class="field"><label>邮件主题 *</label><input id="newsubject" required placeholder="请输入邮件主题"></div><div class="field"><label>邮件类型 *</label><select id="newtype"><option>HL</option><option>FCST</option><option>ETD</option><option>ETA</option><option>对账</option></select></div><div class="field wide"><label>邮件内容 *</label><textarea id="newbody" class="textarea" required placeholder="请输入或粘贴邮件内容..."></textarea></div><div class="field wide"><label>附件（演示）</label><input id="newfile" type="file" multiple></div><div class="wide btnrow" style="justify-content:flex-end"><button type="reset" class="btn">重置</button><button class="btn primary" type="submit">➤ 提交申请</button></div></div></form></section>`}
function submitRequest(e){e.preventDefault();let s=document.getElementById('newsubject').value.trim();requests.unshift({no:'AP'+Date.now().toString().slice(-10),id:0,subject:s,kind:document.getElementById('kind').value,category:document.getElementById('newcat').value,applicant:username,time:new Date().toLocaleString('sv-SE').slice(0,16),status:'待处理',body:document.getElementById('newbody').value});toast('申请已提交（仅保存在本机演示数据中）');go('requests')}
function renderRequests(m){m.innerHTML=hero('申请管理','查看与跟踪邮件模板的新增、修改及优化申请进度','☑')+`<section class="panel"><h2 class="paneltitle">⌕　申请查询</h2><div class="filters" style="grid-template-columns:1.2fr .8fr .8fr .8fr auto"><div class="field keyword"><label>关键词</label><input id="reqkw" placeholder="邮件主题 / 申请人"></div><div class="field"><label>申请类型</label><select id="reqkind"><option>全部</option><option>新增模板</option><option>修改模板</option><option>优化模板</option></select></div><div class="field"><label>申请状态</label><select id="reqstatus"><option>全部</option><option>已通过</option><option>审核中</option><option>待处理</option><option>已驳回</option></select></div><button class="btn primary" onclick="filterRequests()">查询</button></div></section><section class="panel"><h2 class="paneltitle">申请列表（${requests.length}）</h2><div class="tablewrap"><table><thead><tr><th>申请编号</th><th>邮件主题</th><th>申请类型</th><th>项目/类别</th><th>申请人</th><th>申请时间</th><th>当前状态</th><th>操作</th></tr></thead><tbody id="reqrows">${requestRows(requests)}</tbody></table></div></section>`}
function requestRows(arr){return arr.map((r,i)=>`<tr><td>${r.no}</td><td>${r.subject}</td><td>${r.kind}</td><td>${r.category}</td><td>${r.applicant}</td><td>${r.time}</td><td>${statusTag(r.status)}</td><td><button class="btn" onclick="viewRequest(${i})">查看</button></td></tr>`).join('')}
function statusTag(s){return `<span class="status ${s==='已通过'?'ok':s==='审核中'?'wait':s==='待处理'?'pending':'reject'}">${s}</span>`}
function filterRequests(){let kw=document.getElementById('reqkw').value.toLowerCase(),k=document.getElementById('reqkind').value,s=document.getElementById('reqstatus').value;let a=requests.filter(r=>(!kw||r.subject.toLowerCase().includes(kw)||r.applicant.toLowerCase().includes(kw))&&(k==='全部'||r.kind===k)&&(s==='全部'||r.status===s));document.getElementById('reqrows').innerHTML=requestRows(a)}
function viewRequest(i){let r=requests[i];alert(`申请编号：${r.no}\n邮件主题：${r.subject}\n申请人：${r.applicant}\n状态：${r.status}\n\n演示版不连接真实审批系统。`)}
function renderHistory(m){let h=history.slice(0,1),x=mails.find(a=>a.id===h[0]?.id)||mails[0];m.innerHTML=hero('使用历史','查看邮件模板的使用记录，便于快速追溯与统计','◷')+`<section class="panel"><h2 class="paneltitle">⌕　历史查询</h2><div class="filters" style="grid-template-columns:1.3fr .8fr .8fr auto"><div class="field keyword"><label>关键词搜索</label><input placeholder="请输入邮件主题或关键词"></div><div class="field"><label>邮件类型</label><select><option>全部</option><option>HL</option></select></div><div class="field"><label>使用时间</label><input type="date"></div><button class="btn primary" onclick="toast('查询完成')">查询</button></div></section><section class="panel"><h2 class="paneltitle">◷　使用记录（1）</h2><div class="tablewrap"><table><thead><tr><th>序号</th><th>邮件主题</th><th>邮件类型</th><th>项目/类别</th><th>使用时间</th><th>使用人</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td>${x.subject}</td><td><span class="tag">${x.type}</span></td><td>${x.category}</td><td>${h[0]?.time||'2026-10-20 09:35'}</td><td>${h[0]?.user||username}</td><td><button class="btn" onclick="go('library');setTimeout(()=>{document.getElementById('kw').value='Shortage';searchMails('library');},30)">查看</button></td></tr></tbody></table></div></section>`}
function renderSettings(m){m.innerHTML=hero('系统设备','系统配置与账户管理，保障平台稳定高效运行','⚙')+`<section class="panel"><h2 class="paneltitle">🎨　界面颜色设置</h2><p class="muted small">选择主题颜色（仅影响当前浏览器演示）</p><div class="theme-options"><button class="swatch ${currentTheme==='blue'?'active':''}" onclick="setTheme('blue')">🔵 蓝色主题</button><button class="swatch ${currentTheme==='purple'?'active':''}" onclick="setTheme('purple')">🟣 紫色主题</button><button class="swatch ${currentTheme==='green'?'active':''}" onclick="setTheme('green')">🟢 绿色主题</button></div></section><section class="cards"><div class="settingcard"><span class="ic">♙</span><div><strong>用户管理</strong><small>管理系统用户、角色与权限</small></div></div><div class="settingcard"><span class="ic">▱</span><div><strong>项目/类别管理</strong><small>维护项目、类别及相关配置</small></div></div><div class="settingcard"><span class="ic">✉</span><div><strong>邮件类型管理</strong><small>维护 HL、FCST、ETD、ETA</small></div></div><div class="settingcard"><span class="ic">◇</span><div><strong>标签管理</strong><small>设置邮件模板标签</small></div></div><div class="settingcard"><span class="ic">⚙</span><div><strong>系统配置</strong><small>基础参数与默认设置</small></div></div><div class="settingcard"><span class="ic">▤</span><div><strong>数据管理</strong><small>演示数据导入与导出</small></div></div></section><section class="panel" style="margin-top:15px"><h2 class="paneltitle">♙　账户</h2><b>${username}</b><p class="muted small">当前演示用户</p><button class="btn danger" onclick="logout()">⇥ 退出登录</button></section>`}
function setTheme(t){currentTheme=t;let root=document.documentElement;if(t==='purple'){root.style.setProperty('--blue','#7250c9');root.style.setProperty('--navy','#49328c');root.style.setProperty('--pale','#f0ebff');root.style.setProperty('--ink','#332663')}else if(t==='green'){root.style.setProperty('--blue','#16865c');root.style.setProperty('--navy','#086746');root.style.setProperty('--pale','#e6f8ef');root.style.setProperty('--ink','#164d39')}else{root.style.setProperty('--blue','#1260ca');root.style.setProperty('--navy','#073f8b');root.style.setProperty('--pale','#eaf3ff');root.style.setProperty('--ink','#102e68')}render();toast('主题已切换')}
let toastTimer;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}
</script></body></html>
